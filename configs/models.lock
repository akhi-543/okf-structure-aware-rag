  dtype: float16
  max_new_tokens: 512
  generation:
    do_sample: false
    num_beams: 1
  role_note: >
    Extracts the structural graph baseline from authored text. Kept
    separate from benchmark_wording and answer_generator, which share this
    same model_id, because the three are versioned independently: the
    extracted graph baseline must not be silently invalidated by a change
    to either of the other two roles' pins.

answer_generator:
