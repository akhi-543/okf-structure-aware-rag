# Pinned model checkpoints, one entry per role (spec §16; arch §10 Global
# Constraint). Roles that call the same checkpoint still get separate
# entries: repointing the answer generator must not silently invalidate the
# frozen benchmark wording or the extracted graph baseline, and a diff on
# one role's entry must never touch another's.
#
# `revision: UNRESOLVED` ships here on purpose -- a real checkpoint SHA
# cannot be resolved offline, and this file is written before that step
# runs. `revision: UNRESOLVED` is not a usable pin: `okf_rag.jobs.model_lock
# .model_pin` refuses it at the use site. `load_model_pins` does not raise
# on it, so the whole file stays inspectable (e.g. to check every role is
# present) before any revision is resolved.
#
# To pin a role: run `scripts/resolve_model_revisions.py` (created in a
# later phase) to resolve the live commit SHA for its `model_id`, write
# that SHA into `revision` here, and commit the change. Never edit a role's
# `model_id` or `generation` block in the same commit that resolves its
# revision -- that conflates "which checkpoint" with "which commit of it".
#
# Every model output that feeds a benchmark metric is generated greedily
# (`do_sample: false`) and must be logged with its role's model_id and
# revision. `load_model_pins` raises on a generative role whose lock entry
# sets `do_sample: true`: a metric produced by a sampling decode is not
# reproducible from this file.

benchmark_wording:
  model_id: Qwen/Qwen3-4B-Instruct-2507
  revision: cdbee75f17c01a7cc42f958dc650907174af0554
  dtype: float16
  max_new_tokens: 96
  generation:
    do_sample: false
    num_beams: 1
  role_note: >
    Writes the natural-language question for each fact candidate. Kept
    separate from graph_extraction and answer_generator, which share this
    same model_id, because the three are versioned independently: freezing
    the benchmark wording must survive a later change to how the answer
    generator or graph extractor is pinned.

graph_extraction:
  model_id: Qwen/Qwen3-4B-Instruct-2507
